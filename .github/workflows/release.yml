name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      # Full history: the notes fall back to the commit range since the previous
      # tag when no changelog entry exists.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            echo "version=$RELEASE_INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Upstream hand-writes changelog/<version>.md before tagging. This fork
      # releases automatically on every upstream sync, so most releases have no
      # entry; requiring one would fail every automated release. Use the entry
      # when it exists, otherwise summarise the commits since the previous tag.
      - name: Build release notes
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          if [[ -f "changelog/$VERSION.md" ]]; then
            title=$(node scripts/changelog/release-notes.mjs "$VERSION" artifacts/release-notes.md)
            echo "name=OpenChamber Turbo v$VERSION: $title" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(git tag --list 'v*' --sort=-version:refname | grep -v "^v$VERSION$" | head -n 1 || true)
          {
            echo "Automated build of the OpenChamber Turbo fork."
            echo
            echo "Installs beside the official OpenChamber and updates from this repository."
            echo
            if [[ -n "$previous" ]]; then
              echo "### Changes since $previous"
              echo
              git log --no-merges --pretty='- %s' "$previous..HEAD"
            else
              echo "### Commits on top of upstream"
              echo
              git log --no-merges --pretty='- %s' -20
            fi
          } > artifacts/release-notes.md
          echo "name=OpenChamber Turbo v$VERSION" >> "$GITHUB_OUTPUT"

      # A prerelease, not a draft: the upload action publishes a draft as soon as
      # the first upload step finishes, which put releases out before their
      # Windows, server or Android files existed. Updaters only read the latest
      # full release, so nothing installs this one until finalize-release has
      # checked that desktop, server and Android are all attached.
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          prerelease: true
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          name: ${{ steps.release_notes.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This fork publishes no npm package; the tarball is attached to the release
  # instead, and `openchamber update` installs that asset (resolveUpdateTarget
  # in packages/web/server/lib/package-manager.js). Packed with bun so the
  # `workspace:*` link from @openchamber/web to @openchamber/sdk is rewritten to
  # the released version — npm leaves it in place and the tarball then fails to
  # install.
  package-tarball:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      # @openchamber/sdk nao vai para o npm: o tarball dele sai no mesmo release e o
      # @openchamber/web passa a depender da URL desse asset.
      - name: Create sdk tarball
        working-directory: packages/sdk
        run: bun pm pack

      - name: Point web at the released sdk tarball
        working-directory: packages/web
        env:
          SDK_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.version }}/openchamber-sdk-${{ needs.create-release.outputs.version }}.tgz
        run: |
          test -f "../sdk/openchamber-sdk-${{ needs.create-release.outputs.version }}.tgz"
          node -e 'const f="package.json",p=require("./"+f);p.dependencies["@openchamber/sdk"]=process.env.SDK_URL;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'

      - name: Create npm tarball
        working-directory: packages/web
        run: bun pm pack

      - name: Upload npm tarball to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/web/*.tgz
            packages/sdk/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-electron-windows:
    needs: create-release
    # windows-latest currently resolves to a runner with Visual Studio 18,
    # which this electron/node-gyp stack does not detect correctly.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          # Windows arm64 builds on an x64 runner; ripgrep needs the target arch.
          OPENCHAMBER_TARGET_ARCH=${{ matrix.arch }} bun run prepare:ripgrep

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          # Cross-compile for ARM64 target from x64 runner.
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own — we must rebuild against the
        # target Electron ABI before packaging.
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest.yml
          retention-days: 1

  build-desktop-electron-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install rpmbuild for the .rpm package
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build and package Linux AppImage, .deb and .rpm
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$VERSION" \
            "dist/OpenChamber-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage" \
            "dist/OpenChamber-${VERSION}-linux-${DEB_ARCH}.deb" \
            "dist/OpenChamber-${VERSION}-linux-${RPM_ARCH}.rpm"

      - name: Upload validated Linux release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/OpenChamber-${{ needs.create-release.outputs.version }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/OpenChamber-${{ needs.create-release.outputs.version }}-linux-${{ matrix.deb_arch }}.deb
            packages/electron/dist/OpenChamber-${{ needs.create-release.outputs.version }}-linux-${{ matrix.rpm_arch }}.rpm
            packages/electron/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 1

  publish-electron-linux:
    needs: [create-release, build-desktop-electron-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download x64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-x64
          path: artifacts/x64

      - name: Download arm64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-arm64
          path: artifacts/arm64

      - name: Revalidate separate Linux manifests
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/x64/latest-linux.yml "$VERSION" \
            "artifacts/x64/OpenChamber-${VERSION}-linux-x86_64.AppImage" \
            "artifacts/x64/OpenChamber-${VERSION}-linux-amd64.deb" \
            "artifacts/x64/OpenChamber-${VERSION}-linux-x86_64.rpm"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/arm64/latest-linux-arm64.yml "$VERSION" \
            "artifacts/arm64/OpenChamber-${VERSION}-linux-arm64.AppImage" \
            "artifacts/arm64/OpenChamber-${VERSION}-linux-arm64.deb" \
            "artifacts/arm64/OpenChamber-${VERSION}-linux-aarch64.rpm"

      - name: Upload Linux packages and manifests to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            artifacts/x64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-x86_64.AppImage
            artifacts/x64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-amd64.deb
            artifacts/x64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-x86_64.rpm
            artifacts/x64/latest-linux.yml
            artifacts/arm64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-arm64.AppImage
            artifacts/arm64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-arm64.deb
            artifacts/arm64/OpenChamber-${{ needs.create-release.outputs.version }}-linux-aarch64.rpm
            artifacts/arm64/latest-linux-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  combine-electron-manifests:
    needs: [create-release, build-desktop-electron-windows]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Download per-arch update manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: artifacts

      - name: Finalize combined manifests
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          OPENCHAMBER_VERSION: ${{ needs.create-release.outputs.version }}
          # No macOS build in this fork, so there are no Mac manifests to merge.
          WINDOWS_ONLY: '1'
        run: node packages/electron/scripts/finalize-latest-yml.mjs

      - name: Upload combined manifests to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            ${{ runner.temp }}/latest.yml
            ${{ runner.temp }}/latest-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-release:
    needs: create-release
    if: ${{ github.event.inputs.dry_run != 'true' }}
    uses: ./.github/workflows/mobile-release.yml
    with:
      version_name: ${{ needs.create-release.outputs.version }}
      build_number: ${{ github.run_number }}
      release_tag: v${{ needs.create-release.outputs.version }}
      upload_github_release: true
      # No Apple signing assets in this fork, so the iOS leg would fail on the
      # certificate import before it ever reached TestFlight.
      build_ios: false
    secrets: inherit

  finalize-release:
    needs: [create-release, build-desktop-electron-windows, build-desktop-electron-linux, publish-electron-linux, package-tarball, combine-electron-manifests, mobile-release]
    # A dry run skips mobile-release and counts as done; any failure still
    # stops the release. Both steps below skip a dry run.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop, server and Android release assets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          # mobile-release puts this run number in the APK name.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          (async () => {
          const { REPOSITORY: repo, VERSION: version, RELEASE_ID: releaseId, BUILD_NUMBER: build, GITHUB_TOKEN: token } = process.env;
          const expected = [
            `OpenChamber-${version}-win-x64.exe`,
            `OpenChamber-${version}-win-arm64.exe`,
            'latest.yml',
            'latest-arm64.yml',
            `OpenChamber-${version}-linux-x86_64.AppImage`,
            `OpenChamber-${version}-linux-amd64.deb`,
            `OpenChamber-${version}-linux-x86_64.rpm`,
            'latest-linux.yml',
            `OpenChamber-${version}-linux-arm64.AppImage`,
            `OpenChamber-${version}-linux-arm64.deb`,
            `OpenChamber-${version}-linux-aarch64.rpm`,
            'latest-linux-arm64.yml',
            // `openchamber update` installs the web tarball, which depends on the sdk one.
            `openchamber-web-${version}.tgz`,
            `openchamber-sdk-${version}.tgz`,
            `OpenChamber-${version}-${build}-android.apk`,
          ];
          // Use the id returned by create-release to inspect this run's prerelease.
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/${releaseId}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Failed to inspect release assets: ${response.status} ${await response.text()}`);
          const release = await response.json();
          for (const name of expected) {
            const matches = release.assets.filter((asset) => asset.name === name);
            if (matches.length !== 1) throw new Error(`Expected exactly one ${name} release asset, found ${matches.length}`);
            if (!Number.isSafeInteger(matches[0].size) || matches[0].size <= 0) {
              throw new Error(`Release asset ${name} has invalid size ${matches[0].size}`);
            }
          }
          console.log(`Verified ${expected.length} desktop, server and Android release assets.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      # `legacy` lets GitHub pick the latest release by date and version, so a
      # re-run of an older release, or two releases finishing out of order,
      # cannot hand "latest" back to an older version.
      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          prerelease: false
          make_latest: legacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
