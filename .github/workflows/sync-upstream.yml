# Keeps this fork current with upstream's latest release, checked daily.
#
# The sync follows upstream's latest published release, never upstream's `main`,
# so work still in progress upstream does not reach this fork's users. Commits
# of upstream's `main` that this fork already merged by hand stay; the sync does
# nothing until upstream publishes a release this fork does not contain yet.
#
# `main` is the only branch. Each sync merges that release into it, bumps the patch
# version, tags it, and the tag starts the release, so an upstream release
# reaches users as an ordinary update in the app.
#
# Merging keeps every published commit, so the previous release tag stays an
# ancestor of `main`: release.yml's "changes since the previous tag" lists only
# what this sync brought in, and `main` is never force-pushed. A conflict is
# resolved once, in the merge commit, and later syncs only meet what upstream
# changed since the last merge.
#
# When the merge stops on a conflict, text conflicts with both sides present
# go to Copilot CLI; a modify/delete conflict resolves to upstream's structure,
# and the fork's delta on that file is re-landed on top in a follow-up commit
# (it stays recoverable from main's first parent). A resolved merge must pass
# type-check and the web build before it is pushed. If Copilot cannot resolve
# it, or the checks fail, the run fails and leaves `main` untouched; the run
# summary lists the files to resolve by hand.
#
# Versioning: the fork keeps its own plain-semver line rather than upstream's
# number with a suffix. A `-fork.N` prerelease would be skipped by
# electron-updater (autoUpdater.allowPrerelease is false) and would compare equal
# between two fork builds in compareVersions, which strips everything after `-`.
# The next version is one patch above the highest of the fork's version, its
# latest tag and upstream's version, so it always increases and never falls
# behind upstream's line. Colliding with an upstream version number is harmless:
# this fork only ever reads its own releases.
name: sync-upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Pushes go through SYNC_PUSH_TOKEN; GITHUB_TOKEN only reads the repository
# and, when issues are on, files the conflict issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_SLUG: openchamber/openchamber
  UPSTREAM_REPO: https://github.com/openchamber/openchamber.git
  BRANCH: main
  # In a fork `gh` resolves the repo to the parent and returns 403; pinning it to
  # this fork is what makes the issue lookup work.
  GH_REPO: ${{ github.repository }}
  COPILOT_CLI_VERSION: 1.0.97

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can neither push a commit that changes a workflow, which
      # upstream does several times a week, nor start a workflow with the tag it
      # pushes. This fine-grained token (this repository only, Contents and
      # Workflows read and write) does both.
      - name: Require the push token
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          if [ -z "$SYNC_PUSH_TOKEN" ]; then
            echo "::error::Add the SYNC_PUSH_TOKEN repository secret: a fine-grained token for this repository with Contents and Workflows read and write."
            exit 1
          fi

      # The push token is configured only in the push step. Copilot, bun install
      # and the checks run upstream code before that and never see it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # bump-version.mjs refreshes the Bun lockfile, so the runner needs Bun.
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # zdiff3 puts the common ancestor in each conflict, which Copilot needs to
      # tell what each side changed.
      - name: Configure git
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle zdiff3

      # releases/latest skips drafts and prereleases. The tag is fetched into a
      # remote-tracking ref, never into refs/tags: a pushed v* tag starts a
      # release here, so upstream's version tags must never reach this repository.
      - name: Fetch upstream's latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$UPSTREAM_SLUG/releases/latest" --jq .tag_name)
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag on upstream's latest release: $tag"
            exit 1
          fi
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "+refs/tags/$tag:refs/remotes/upstream/release"
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"
          echo "Upstream's latest release is $tag."

      # COPILOT_GITHUB_TOKEN is a fine-grained token owned by a personal account
      # with only the "Copilot Requests" account permission. Copilot Free is
      # enough. Without it a conflict fails the run as before.
      - name: Merge upstream
        id: merge
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor "upstream/release^{commit}" HEAD; then
            echo "$BRANCH already contains upstream $UPSTREAM_TAG; nothing to do until the next upstream release."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "fork_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

          message="Merge upstream $UPSTREAM_TAG"
          if git merge --no-edit -m "$message" "upstream/release^{commit}"; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts="$RUNNER_TEMP/conflicts"
          git diff --name-only --diff-filter=U > "$conflicts"
          mapfile -t files < "$conflicts"

          give_up() {
            echo "::error::$1"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          }

          # From here on, any unexpected failure aborts the merge and falls back
          # to the manual conflict report.
          trap 'give_up "Resolving the conflict failed at line $LINENO."' ERR

          # Text conflicts with both sides present go to Copilot. A
          # modify/delete conflict has no text to merge: upstream's structure
          # wins (its refactor moved or removed the file) and the fork's delta
          # on that file is re-landed deliberately afterwards — it stays
          # recoverable from main's first parent. Binary conflicts still fail
          # the run.
          sources=()
          ported=()
          generated=()
          for file in "${files[@]}"; do
            [ "$file" = bun.lock ] && continue
            case "$file" in
              packages/sdk/examples/*)
                # Generated guest bundles (`bun scripts/bundle-guest.ts` in
                # packages/sdk builds them): merging build artifacts invites
                # nonsense, so take upstream's build now and let the fork's
                # own rebuild regenerate fork-side examples on top.
                git checkout -q --theirs -- "$file" && git add -- "$file"
                generated+=("$file")
                continue
                ;;
            esac
            stages=$(git ls-files -u -- "$file" | awk '{print $3}' | sort -u | tr -d '\n')
            if [[ $stages != *2*3* ]]; then
              if [[ $stages == *2* ]]; then
                git rm -q -- "$file" # deleted upstream, modified here: take the deletion
              else
                git checkout -q --theirs -- "$file" && git add -- "$file" # deleted here, changed upstream: keep upstream's
              fi
              ported+=("$file")
            elif ! grep -qE '^<<<<<<<( |$)' -- "$file"; then
              give_up "\`$file\` has a conflict Copilot cannot resolve (binary)."
            else
              sources+=("$file")
            fi
          done

          deleted_note=""
          if [ "${#ported[@]}" -gt 0 ]; then
            deleted_note="Upstream deleted some of the conflicted files; they are already resolved as upstream structured them: $(printf -- '%s, ' "${ported[@]}" | sed 's/, $//').
          When a fork change you are reapplying depended on such a deleted file, follow upstream's new structure — the module, route or component that replaced it — instead of reintroducing the old file.

          "
          fi

          if [ "${#sources[@]}" -gt 0 ]; then
            if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
              give_up "The merge stopped on a text conflict and the COPILOT_GITHUB_TOKEN secret is not set, so nothing resolved it."
            fi
            npm install --global --silent "@github/copilot@$COPILOT_CLI_VERSION"

            # Copilot can run out of steam or misread its scope on a long
            # file list; each retry gets only what still carries markers.
            remaining=("${sources[@]}")
            attempt=0
            while [ "${#remaining[@]}" -gt 0 ] && [ "$attempt" -lt 3 ]; do
              attempt=$((attempt + 1))

              prompt="You are finishing a git merge of upstream release $UPSTREAM_TAG into this fork's $BRANCH (attempt $attempt). The merge stopped with conflicts in:
          $(printf -- '- %s\n' "${remaining[@]}")

          In each conflict, the part between <<<<<<< and ||||||| is the fork, the part between ||||||| and ======= is the common ancestor, and the part between ======= and >>>>>>> is upstream.
          To see what each side changed in a file and why:
          - the fork: \`git diff MERGE_HEAD...HEAD -- <file>\` and \`git log --oneline MERGE_HEAD..HEAD -- <file>\`
          - upstream: \`git diff HEAD...MERGE_HEAD -- <file>\` and \`git log --oneline HEAD..MERGE_HEAD -- <file>\`

          Resolve every conflict in those files. Keep upstream's code and reapply the fork's change on top of it, so both survive. Where upstream already makes the fork's change, keep upstream's version. Remove every conflict marker.
          A conflict on the \"version\" field of a package.json can take either value; a later step rewrites it.
          ${deleted_note}Edit only the files listed above. Do not edit, create or delete any other file, including documentation, changelogs or tests, even when repository instructions such as AGENTS.md ask for it. Do not run git commands that change the index, the history or the working tree."

              copilot -p "$prompt" -s --no-ask-user \
                --allow-tool=write \
                --allow-tool='shell(git show:*)' \
                --allow-tool='shell(git diff:*)' \
                --allow-tool='shell(git log:*)' \
                --allow-tool='shell(grep:*)' \
                || give_up "Copilot CLI failed."

              stray=$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -vxF -f "$conflicts" || true)
              if [ -n "$stray" ]; then
                give_up "Copilot changed files outside the conflict: $(tr '\n' ' ' <<<"$stray")"
              fi

              next=()
              for file in "${remaining[@]}"; do
                if grep -qE '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)( |$)' -- "$file"; then
                  next+=("$file")
                fi
              done
              if [ "${#next[@]}" -gt 0 ]; then remaining=("${next[@]}"); else remaining=(); fi
            done
            if [ "${#remaining[@]}" -gt 0 ]; then
              give_up "Conflict markers remain after $attempt Copilot attempts: $(printf -- '%s, ' "${remaining[@]}" | sed 's/, $//')."
            fi
            git add -- "${sources[@]}"
          fi

          # The lockfile is regenerated from upstream's lockfile and the
          # resolved manifests. During a merge, --theirs is upstream.
          if printf '%s\n' "${files[@]}" | grep -qxF bun.lock; then
            git checkout --theirs -- bun.lock
            bun install --lockfile-only
            git add bun.lock
          fi

          git commit --no-edit -m "$message" \
            -m "Resolved to upstream's structure — re-land the fork delta on top:
          $(printf -- '- %s\n' "${ported[@]}")" \
            -m "Generated files taken from upstream — regenerate fork-side builds on top:
          $(printf -- '- %s\n' "${generated[@]}")" \
            -m "Copilot resolved conflicts in:
          $(printf -- '- %s\n' "${sources[@]}")"

          echo "status=merged" >> "$GITHUB_OUTPUT"
          if [ "${#ported[@]}" -gt 0 ] || [ "${#generated[@]}" -gt 0 ] || [ "${#sources[@]}" -gt 0 ]; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Upstream sync conflicts resolved"
            echo
            if [ "${#ported[@]}" -gt 0 ]; then
              echo "Resolved to upstream's structure. Re-land the fork delta on top in a follow-up commit; it stays recoverable from \`main\`'s first parent:"
              printf -- '- `%s`\n' "${ported[@]}"
              echo
            fi
            if [ "${#generated[@]}" -gt 0 ]; then
              echo "Generated files taken from upstream; regenerate fork-side builds on top (packages/sdk: \`bun scripts/bundle-guest.ts\`):"
              printf -- '- `%s`\n' "${generated[@]}"
              echo
            fi
            if [ "${#sources[@]}" -gt 0 ]; then
              echo "Resolved by Copilot:"
              printf -- '- `%s`\n' "${sources[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.merge.outputs.resolved == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      # Resolved work (Copilot or structure resolutions) is checked here; a
      # clean merge releases as before.
      - name: Check the resolved code
        if: steps.merge.outputs.resolved == 'true'
        run: |
          set -uo pipefail
          if ! { bun install --frozen-lockfile && bun run type-check && bun run build:web; }; then
            {
              echo
              echo "### The resolved code failed the checks"
              echo
              echo "\`$BRANCH\` was left untouched and nothing was released. Resolve the conflicts above by hand:"
              echo
              echo '```bash'
              echo "git fetch --no-tags upstream refs/tags/$UPSTREAM_TAG"
              echo "git merge FETCH_HEAD   # resolve the conflicts, then git commit"
              echo "node scripts/bump-version.mjs <next version> && git commit -am 'release v<next version>'"
              echo "git push origin $BRANCH && git tag v<next version> && git push origin v<next version>"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Bump the fork version
        id: version
        if: steps.merge.outputs.status == 'merged'
        env:
          FORK_VERSION: ${{ steps.merge.outputs.fork_version }}
        run: |
          set -euo pipefail
          upstream_version=$(git show "upstream/release:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          latest_tag=$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v[0-9]*.[0-9]*.[0-9]*')
          next=$(node -e '
            const versions = process.argv.slice(1).filter(Boolean)
              .map((value) => value.replace(/^v/, "").split("-")[0].split(".").map(Number));
            versions.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
            const [major, minor, patch] = versions.at(-1);
            console.log([major, minor, patch + 1].join("."));
          ' "$FORK_VERSION" "$upstream_version" "$latest_tag")
          node scripts/bump-version.mjs "$next"
          git add -A
          git commit -m "release v$next

          Upstream sync: merged upstream release $UPSTREAM_TAG.
          Previous fork version was $FORK_VERSION; upstream is at $upstream_version."
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # Pushed with SYNC_PUSH_TOKEN, so the tag starts release.yml by itself. A
      # plain push: if `main` moved during the run, the push fails and the next
      # sync merges on top of the new `main`.
      - name: Push branch and tag
        if: steps.merge.outputs.status == 'merged'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$(printf 'x-access-token:%s' "$SYNC_PUSH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_PUSH_TOKEN" | base64 -w0)"
          # Earlier steps ran upstream code that could have written hooks into
          # .git; none of them may run while the token is configured.
          push() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false push "$@"; }
          push origin "$BRANCH"
          git tag "v$VERSION"
          push origin "v$VERSION"

      - name: Report the conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Upstream sync stopped on a conflict"
            echo
            echo "Copilot did not resolve it, and \`$BRANCH\` was left untouched. The merge conflicted in:"
            echo
            while IFS= read -r file; do echo "- \`$file\`"; done < "$RUNNER_TEMP/conflicts"
            echo
            echo "Resolve it locally, then release the result:"
            echo
            echo '```bash'
            echo "git fetch --no-tags upstream refs/tags/$UPSTREAM_TAG"
            echo "git merge FETCH_HEAD   # resolve the conflicts, then git commit"
            echo "node scripts/bump-version.mjs <next version> && git commit -am 'release v<next version>'"
            echo "git push origin $BRANCH && git tag v<next version> && git push origin v<next version>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Issues are off in this fork today; the failed run and its summary are
          # the notice then.
          if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" = "true" ] \
            && [ "$(gh issue list --state open --label sync-conflict --json number --jq 'length')" -eq 0 ]; then
            gh label create sync-conflict --color D93F0B --force
            gh issue create \
              --title "Upstream sync conflict ($(date +%F))" \
              --label sync-conflict \
              --body-file "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
