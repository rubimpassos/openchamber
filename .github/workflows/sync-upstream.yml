# Sincroniza o fork com o upstream diariamente:
#   1. `main`   = espelho exato de openchamber/openchamber@main (reset --hard)
#   2. `custom` = pilha de patches própria, rebaseada sobre o novo main
# Em conflito de rebase: aborta, abre issue e mantém `custom` intacta.
#
# IMPORTANTE: esta é a branch default do fork — workflows `schedule`
# só disparam a partir da branch default.
name: sync-upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/openchamber/openchamber.git
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: main
  PATCH_BRANCH: custom

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Mirror main
        run: |
          git checkout -B "$MIRROR_BRANCH" "upstream/$UPSTREAM_BRANCH"
          git push --force origin "$MIRROR_BRANCH"

      - name: Rebase patch branch
        id: rebase
        run: |
          git checkout "$PATCH_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "custom já contém o upstream mais recente; nada a fazer."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rebase "upstream/$UPSTREAM_BRANCH"; then
            git push --force-with-lease origin "$PATCH_BRANCH"
            echo "status=rebased" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open conflict issue
        if: steps.rebase.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --label sync-conflict --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh label create sync-conflict --color D93F0B --force
            gh issue create \
              --title "Conflito no sync com upstream ($(date +%F))" \
              --label sync-conflict \
              --body "$(printf 'O rebase automático de `%s` sobre `upstream/%s` falhou.\n\nResolver localmente:\n```bash\ngit fetch upstream\ngit checkout %s\ngit tag custom-backup-%s\ngit rebase upstream/%s   # resolver conflitos\ngit push --force-with-lease origin %s\n```' "$PATCH_BRANCH" "$UPSTREAM_BRANCH" "$PATCH_BRANCH" "$(date +%F)" "$UPSTREAM_BRANCH" "$PATCH_BRANCH")"
          fi
          exit 1
