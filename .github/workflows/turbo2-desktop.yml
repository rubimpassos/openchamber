name: Turbo 2 desktop (Windows)

# Builds the side-by-side "OpenChamber Turbo 2" installer as a workflow
# artifact only. It never creates a tag or a GitHub release: the v1 web server
# and the v1 Turbo desktop update themselves from this fork's releases, and a
# 2.x release there would be offered to them as an update.
on:
  push:
    branches:
      - turbo2-desktop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbo2-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # windows-latest resolves to Visual Studio 18, which this electron/node-gyp
    # stack does not detect correctly (same pin as release.yml).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-x64-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-x64-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: x64
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --x64 --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-turbo2-windows-x64
          path: packages/electron/dist/*.exe
          if-no-files-found: error
          retention-days: 14
