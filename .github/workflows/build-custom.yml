# Builda os apps do fork (APK Android assinado + .exe Windows) a partir da
# branch `custom` e publica numa prerelease rolante `custom-latest`.
#
# Dispara após o sync-upstream (workflow_run — necessário porque pushes feitos
# com GITHUB_TOKEN não disparam `on: push`), em push manual na custom, ou na mão.
#
# Secrets exigidos (Android): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. O .exe Windows sai sem assinatura.
name: build-custom

on:
  workflow_run:
    workflows: [sync-upstream]
    types: [completed]
  push:
    branches: [custom]
    paths-ignore:
      - ".github/workflows/sync-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-custom
  cancel-in-progress: true

env:
  RELEASE_TAG: custom-latest

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom

      - name: Resolve version and skip if already built
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          released_sha=$(gh release view "$RELEASE_TAG" --json body --jq .body 2>/dev/null | grep -oP 'sha:\K[0-9a-f]{40}' || true)

          should_build=true
          if [[ "$released_sha" == "$sha" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "custom-latest já cobre $sha; nada a buildar."
            should_build=false
          fi

          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:8}"
            echo "version=$version"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install

      - name: Prepare Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openchamber-release.keystore"

      - name: Build signed Android APK
        env:
          OPENCHAMBER_ANDROID_VERSION_CODE: ${{ github.run_number }}
          OPENCHAMBER_ANDROID_VERSION_NAME: ${{ needs.check.outputs.version }}-custom.${{ needs.check.outputs.short_sha }}
          OPENCHAMBER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openchamber-release.keystore
          OPENCHAMBER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENCHAMBER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENCHAMBER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bun run mobile:sync
          ./packages/mobile/android/gradlew -p packages/mobile/android assembleRelease

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp packages/mobile/android/app/build/outputs/apk/release/*.apk \
            "release-assets/OpenChamber-${{ needs.check.outputs.version }}-custom.${{ needs.check.outputs.short_sha }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk
          if-no-files-found: error

  windows:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    # windows-latest resolve pra runner com Visual Studio 18, que o stack
    # electron/node-gyp não detecta (mesmo motivo do upstream)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-x64-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-x64-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app (unsigned)
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --x64 --publish=never
          bun run verify:opencode-cli:packaged

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/latest.yml
          if-no-files-found: error

  publish:
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Recreate rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            --prerelease \
            --title "custom ${{ needs.check.outputs.version }}-custom.${{ needs.check.outputs.short_sha }}" \
            --notes "$(printf 'Build automático da branch custom.\n\nsha:%s\n\n- APK assinado com keystore próprio (primeira instalação sobre o app da loja exige desinstalar o original)\n- .exe sem assinatura (SmartScreen: "Mais informações" > "Executar assim mesmo")' "${{ needs.check.outputs.sha }}")" \
            --target custom \
            release-assets/*
